version: '3'

services:
  minio:
    image: docker.io/bitnami/minio:2022
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - minionetwork
    environment:
      - MINIO_ROOT_USER=minio12345
      - MINIO_ROOT_PASSWORD=minio12345

networks:
  minionetwork:
    driver: bridge

volumes:
  minio_data:
    driver: local